<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide de Voyage Tunisien - Découvrez le Monde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🌍 Guide de Voyage Tunisien</h1>
                <p>Découvrez les meilleures destinations accessibles depuis la Tunisie</p>
            </div>
        </header>

        <!-- Search & Filters Section -->
        <section class="search-filters-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="🔍 Rechercher un pays..."
                    autocomplete="off">
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">
                    📍 Tous les pays
                </button>
                <button class="filter-btn" data-filter="no-visa">
                    ✓ Sans visa
                </button>
                <button class="filter-btn" data-filter="low-budget">
                    💰 Budget modéré
                </button>
                <button class="filter-btn" data-filter="beach">
                    🏖️ Plages
                </button>
                <button class="filter-btn" data-filter="culture">
                    🏛️ Culture
                </button>
            </div>

            <div class="sort-box">
                <label for="sortSelect">Trier par:</label>
                <select id="sortSelect">
                    <option value="name">Nom (A-Z)</option>
                    <option value="visa">Statut visa</option>
                    <option value="budget">Budget croissant</option>
                </select>
            </div>
        </section>

        <!-- Countries Grid -->
        <section class="countries-grid" id="countriesGrid">
            <!-- Les cartes de pays seront générées ici par JavaScript -->
        </section>

        <!-- No Results Message -->
        <div id="noResults" class="no-results" style="display: none;">
            <p>😔 Aucun pays trouvé. Essayez une autre recherche.</p>
        </div>
    </div>

    <!-- Modal pour les détails du pays -->
    <div id="countryModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody">
                <!-- Contenu du pays sera généré ici -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2024 Guide de Voyage Tunisien | Voyagez en toute confiance 🌟</p>
        <p>Repository: <a href="https://github.com/senda-wq/test" target="_blank">senda-wq/test</a></p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
